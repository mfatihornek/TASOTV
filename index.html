<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>TASO Announcement TV</title>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  overflow:hidden;
  color:white;

  background:linear-gradient(-45deg,#0f172a,#1e293b,#0ea5e9,#22c55e);
  background-size:400% 400%;
  animation:gradientMove 18s ease infinite;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* LAYOUT */
.container{
  display:flex;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* LEFT */
.main{
  width:78%;
  height:100%;
  position:relative;
  overflow:hidden; /* FIX: prevents overlap into divider */
}

.main iframe{
  position:absolute;
  top:-55px;
  left:0;
  width:100%;
  height:calc(100% + 55px);
  border:none;
}

/* TICKER WRAP */
.ticker-wrap{
  position:absolute;
  bottom:0;
  left:0;

  width:100%;
  height:85px;

  background:linear-gradient(90deg,#1e3a8a,#0ea5e9,#22c55e);

  overflow:hidden;
  display:flex;
  align-items:center;

  border-top:2px solid rgba(255,255,255,0.25);
  padding:0 20px; /* FIX: breathing room left/right */
}

/* TICKER TEXT */
.ticker{
  white-space:nowrap;

  font-size:26px;
  font-weight:600;
  color:white;

  line-height:85px;
  letter-spacing:1px;

  padding-left:100%;

  animation:scrollText 45s linear infinite; /* SLOWER */
}

/* MORE SPACE BETWEEN REPEATED SENTENCES */
.ticker span{
  margin-right:80px; /* spacing between repeats */
}

/* ANIMATION */
@keyframes scrollText{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* RIGHT SIDE */
.sidebar{
  width:22%;
  background:linear-gradient(to bottom,#0f172a,#1e3a8a);

  border-left:3px solid rgba(255,255,255,0.15);

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:20px;
}

/* LOGO */
.logo-box{
  width:100%;
  background:white;
  border-radius:18px;
  padding:15px;
  margin-bottom:25px;

  display:flex;
  justify-content:center;
  align-items:center;
}

.logo{
  width:100%;
  max-width:280px;
}

/* CLOCK */
.clock{
  text-align:center;
  margin-bottom:30px;
}

.time{
  font-size:58px;
  font-weight:bold;
}

.date{
  margin-top:8px;
  font-size:20px;
  color:#cbd5e1;
}

/* WEATHER */
.weather{
  width:100%;
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:22px;
  text-align:center;
}

.weather-title{
  font-size:24px;
  margin-bottom:15px;
}

.temp{
  font-size:64px;
  font-weight:bold;
  color:#38bdf8;
}

.condition{
  font-size:24px;
  margin-top:10px;
}

.location{
  margin-top:12px;
  font-size:18px;
  color:#94a3b8;
}

/* FOOTER */
.footer{
  margin-top:auto;
  text-align:center;
  font-size:16px;
  color:#cbd5e1;
  padding-top:20px;
}

</style>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="main">

    <iframe
      src="https://docs.google.com/presentation/d/e/2PACX-1vRWDkXRsxtpcAfTdoLE7yyd9FnhYNNByYHfHWkV9VWZySOFN8dmJBe41EGafihr5pYxo8dDklQ7xcKw/embed?start=true&loop=true&delayms=10000&rm=minimal"
      allowfullscreen>
    </iframe>

    <!-- TICKER -->
    <div class="ticker-wrap">
      <div class="ticker">

        <span>Welcome to Turkish American Society of Ohio</span>
        <span>•</span>

        <span>Community announcements and events</span>
        <span>•</span>

        <span>Weekend school and cultural programs</span>
        <span>•</span>

        <span>Welcome to Turkish American Society of Ohio</span>
        <span>•</span>

      </div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="sidebar">

    <div class="logo-box">
      <img src="taso-logo.png" class="logo" alt="TASO Logo">
    </div>

    <div class="clock">
      <div class="time" id="time"></div>
      <div class="date" id="date"></div>
    </div>

    <div class="weather">
      <div class="weather-title">Columbus Weather</div>
      <div class="temp" id="temp">--</div>
      <div class="condition" id="condition">Loading...</div>
      <div class="location">Columbus, Ohio</div>
    </div>

    <div class="footer">
      Turkish American Society of Ohio
    </div>

  </div>

</div>

<script>

/* CLOCK */
function updateClock(){
  const now = new Date();

  document.getElementById('time').innerHTML =
    now.toLocaleTimeString('en-US',{
      hour:'numeric',
      minute:'2-digit',
      hour12:true
    });

  document.getElementById('date').innerHTML =
    now.toLocaleDateString('en-US',{
      weekday:'long',
      month:'long',
      day:'numeric'
    });
}

updateClock();
setInterval(updateClock,1000);

/* WEATHER */
async function loadWeather(){
  try{
    const response = await fetch(
      'https://api.open-meteo.com/v1/forecast?latitude=39.9612&longitude=-82.9988&current_weather=true&temperature_unit=fahrenheit'
    );

    const data = await response.json();
    const temp = Math.round(data.current_weather.temperature);

    document.getElementById('temp').innerHTML = temp + '°F';
    document.getElementById('condition').innerHTML =
      weatherText(data.current_weather.weathercode);

  }catch(e){
    document.getElementById('condition').innerHTML = 'Unavailable';
  }
}

function weatherText(code){
  const map = {
    0:'Clear Sky',
    1:'Mainly Clear',
    2:'Partly Cloudy',
    3:'Cloudy',
    45:'Fog',
    48:'Fog',
    51:'Light Drizzle',
    53:'Drizzle',
    55:'Heavy Drizzle',
    61:'Rain',
    63:'Rain',
    65:'Heavy Rain',
    71:'Snow',
    80:'Rain Showers',
    95:'Thunderstorm'
  };

  return map[code] || 'Weather';
}

loadWeather();
setInterval(loadWeather,600000);

</script>

</body>
</html>
