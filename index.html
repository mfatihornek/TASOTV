<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TASO Announcement TV</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      overflow:hidden;
      background:#0f172a;
      color:white;
    }

    .container{
      display:flex;
      width:100vw;
      height:100vh;
    }

    /* LEFT SIDE */
    .main{
      width:78%;
      height:100%;
      background:black;
      position:relative;
    }

    .main iframe{
      position:absolute;
      top:-60px;        /* hides Google Slides toolbar */
      left:0;
      width:100%;
      height:calc(100% + 60px);
      border:none;
    }

    /* RIGHT SIDE */
    .sidebar{
      width:22%;
      background:linear-gradient(to bottom,#111827,#1e293b);
      border-left:4px solid #ef4444;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:20px;
    }

    .logo-container{
      width:100%;
      background:white;
      border-radius:20px;
      padding:15px;
      display:flex;
      justify-content:center;
      align-items:center;
      margin-bottom:30px;
    }

    .logo{
      width:100%;
      max-width:320px;
      height:auto;
      object-fit:contain;
    }

    .clock{
      text-align:center;
      margin-bottom:35px;
    }

    .time{
      font-size:64px;
      font-weight:bold;
    }

    .date{
      margin-top:10px;
      font-size:24px;
      color:#cbd5e1;
    }

    .weather{
      width:100%;
      background:rgba(255,255,255,0.08);
      border-radius:22px;
      padding:25px;
      text-align:center;
      backdrop-filter:blur(8px);
    }

    .weather-title{
      font-size:28px;
      margin-bottom:20px;
    }

    .temp{
      font-size:72px;
      font-weight:bold;
      color:#38bdf8;
    }

    .condition{
      margin-top:10px;
      font-size:28px;
    }

    .location{
      margin-top:15px;
      color:#94a3b8;
      font-size:22px;
    }

    .footer{
      margin-top:auto;
      text-align:center;
      color:#94a3b8;
      font-size:18px;
      padding-top:25px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LEFT PRESENTATION -->
  <div class="main">

    <iframe
      src="https://docs.google.com/presentation/d/e/2PACX-1vRWDkXRsxtpcAfTdoLE7yyd9FnhYNNByYHfHWkV9VWZySOFN8dmJBe41EGafihr5pYxo8dDklQ7xcKw/embed?start=true&loop=true&delayms=10000&rm=minimal"
      allowfullscreen="true">
    </iframe>

  </div>

  <!-- RIGHT PANEL -->
  <div class="sidebar">

    <div class="logo-container">
      <!-- IMPORTANT -->
      <!-- upload your logo file into github repo -->
      <!-- rename file EXACTLY to: taso-logo.png -->

      <img
        src="./taso-logo.png"
        alt="TASO Logo"
        class="logo"
      />
    </div>

    <!-- CLOCK -->
    <div class="clock">
      <div class="time" id="time"></div>
      <div class="date" id="date"></div>
    </div>

    <!-- WEATHER -->
    <div class="weather">

      <div class="weather-title">
        Columbus Weather
      </div>

      <div class="temp" id="temp">
        --
      </div>

      <div class="condition" id="condition">
        Loading...
      </div>

      <div class="location">
        Columbus, Ohio
      </div>

    </div>

    <div class="footer">
      Turkish American Society of Ohio
    </div>

  </div>

</div>

<script>

  // CLOCK
  function updateClock(){

    const now = new Date();

    document.getElementById('time').innerHTML =
      now.toLocaleTimeString('en-US',{
        hour:'numeric',
        minute:'2-digit',
        hour12:true
      });

    document.getElementById('date').innerHTML =
      now.toLocaleDateString('en-US',{
        weekday:'long',
        month:'long',
        day:'numeric'
      });
  }

  updateClock();
  setInterval(updateClock,1000);

  // WEATHER
  async function loadWeather(){

    try{

      const response = await fetch(
        'https://api.open-meteo.com/v1/forecast?latitude=39.9612&longitude=-82.9988&current_weather=true&temperature_unit=fahrenheit'
      );

      const data = await response.json();

      const temp = Math.round(data.current_weather.temperature);

      document.getElementById('temp').innerHTML =
        temp + '°F';

      document.getElementById('condition').innerHTML =
        weatherCode(data.current_weather.weathercode);

    }catch(e){

      document.getElementById('condition').innerHTML =
        'Unavailable';

    }
  }

  function weatherCode(code){

    const map = {
      0:'Clear Sky',
      1:'Mainly Clear',
      2:'Partly Cloudy',
      3:'Cloudy',
      45:'Fog',
      48:'Fog',
      51:'Light Drizzle',
      53:'Drizzle',
      55:'Heavy Drizzle',
      61:'Light Rain',
      63:'Rain',
      65:'Heavy Rain',
      71:'Snow',
      80:'Rain Showers',
      95:'Thunderstorm'
    };

    return map[code] || 'Weather';
  }

  loadWeather();

  setInterval(loadWeather,600000);

</script>

</body>
</html>
